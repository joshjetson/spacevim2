<svg width="880" height="220" viewBox="0 0 880 220" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SpaceVim2 — Modular Vim and Neovim, revived">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1b1f2e"/>
      <stop offset="1" stop-color="#0d0f17"/>
    </linearGradient>
    <linearGradient id="accent" x1="470" y1="70" x2="640" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5fd7ff"/>
      <stop offset="0.55" stop-color="#8ab4ff"/>
      <stop offset="1" stop-color="#ff875f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5fd7ff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#5fd7ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="1" y="1" width="878" height="218" rx="18" fill="url(#bg)" stroke="#2a2f42"/>
  <ellipse cx="300" cy="110" rx="240" ry="240" fill="url(#glow)"/>

  <!-- starfield -->
  <g fill="#ffffff">
    <circle cx="60" cy="44" r="1.4" opacity="0.55"/>
    <circle cx="128" cy="150" r="1" opacity="0.4"/>
    <circle cx="210" cy="70" r="1.6" opacity="0.6"/>
    <circle cx="96" cy="96" r="1" opacity="0.3"/>
    <circle cx="255" cy="164" r="1.2" opacity="0.45"/>
    <circle cx="800" cy="52" r="1.5" opacity="0.55"/>
    <circle cx="748" cy="120" r="1" opacity="0.35"/>
    <circle cx="838" cy="150" r="1.3" opacity="0.5"/>
    <circle cx="700" cy="40" r="1" opacity="0.3"/>
    <circle cx="632" cy="176" r="1.1" opacity="0.4"/>
  </g>

  <!-- orbit + planet -->
  <g transform="rotate(-18 440 110)">
    <ellipse cx="440" cy="110" rx="320" ry="70" fill="none" stroke="url(#accent)" stroke-width="1.5" opacity="0.5"/>
    <circle cx="760" cy="110" r="6" fill="#ff875f"/>
    <circle cx="120" cy="110" r="3.5" fill="#5fd7ff"/>
  </g>

  <!-- wordmark -->
  <text x="440" y="118" text-anchor="middle"
        font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace"
        font-size="66" font-weight="700" letter-spacing="-1">
    <tspan fill="#5fd7ff">❯ </tspan><tspan fill="#f4f6fb">SpaceVim</tspan><tspan fill="url(#accent)">2</tspan>
  </text>

  <!-- tagline -->
  <text x="440" y="162" text-anchor="middle"
        font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace"
        font-size="19" letter-spacing="0.5" fill="#9aa2ba">
    Modular Vim &amp; Neovim, revived
  </text>

  <!-- underline accent -->
  <rect x="330" y="182" width="220" height="2.5" rx="1.25" fill="url(#accent)" opacity="0.7"/>
</svg>
